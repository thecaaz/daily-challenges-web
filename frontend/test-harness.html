<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ScoreBridge PoC Test Harness</title>
    <style>
      body {
        font-family: system-ui, Arial;
        padding: 20px;
      }
      iframe {
        width: 100%;
        height: 800px;
        border: 1px solid #ddd;
      }
      .preview {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div style="margin-top: 12px">
      <button id="getScore">Request Score</button>
      <button id="visibleCaptureBtn">Request Capture</button>
    </div>

    <iframe id="gameFrame" src="https://timeguessr.com/roundonedaily"></iframe>

    <div class="results">
      <h3>Result</h3>
      <pre id="result">(no result yet)</pre>
      <div class="preview">
        <h4>Capture Preview</h4>
        <img
          id="previewImg"
          alt="capture preview"
          style="
            max-width: 480px;
            display: block;
            border: 1px solid #ddd;
            padding: 4px;
          "
        />
        <div id="captureInfo"></div>
      </div>
    </div>

    <script>
      // Manual harness for the ScoreBridge flow. Serve it from localhost (a dev
      // build of the extension trusts http://localhost:*; release builds don't).
      const iframe = document.getElementById('gameFrame')
      const previewImg = document.getElementById('previewImg')
      const result = document.getElementById('result')
      const captureInfo = document.getElementById('captureInfo')

      function genNonce() {
        return crypto.randomUUID()
      }

      function iframeOrigin() {
        return new URL(iframe.src).origin
      }

      // Pending requests; responses must echo these nonces.
      const pending = { score: null, capture: null }
      // State used when temporarily making the iframe fullscreen during capture
      const captureState = { prevStyle: null, timeoutId: null }

      function applyIframeFullscreenOverlay() {
        if (captureState.prevStyle !== null) return
        captureState.prevStyle = iframe.getAttribute('style') || ''
        iframe.style.position = 'fixed'
        iframe.style.top = '0'
        iframe.style.left = '0'
        iframe.style.width = '100vw'
        iframe.style.height = '100vh'
        iframe.style.margin = '0'
        iframe.style.zIndex = '2147483647'
      }

      function restoreIframeFromFullscreen() {
        if (captureState.timeoutId) {
          clearTimeout(captureState.timeoutId)
          captureState.timeoutId = null
        }
        if (captureState.prevStyle === null) return
        iframe.setAttribute('style', captureState.prevStyle)
        captureState.prevStyle = null
      }

      window.addEventListener('message', ev => {
        if (!ev.data || typeof ev.data.type !== 'string') return

        if (ev.data.type === 'SCORE_RESPONSE') {
          if (ev.source !== iframe.contentWindow || ev.origin !== iframeOrigin()) return
          if (!pending.score || ev.data.nonce !== pending.score) return
          pending.score = null
          result.textContent = 'Score: ' + JSON.stringify(ev.data.score)
        }

        if (ev.data.type === 'CAPTURE_RESPONSE') {
          if (ev.source !== window || ev.origin !== location.origin) return
          if (!pending.capture || ev.data.nonce !== pending.capture) return
          pending.capture = null
          restoreIframeFromFullscreen()

          if (ev.data.error) {
            captureInfo.textContent = 'Capture error: ' + ev.data.error
            previewImg.removeAttribute('src')
            return
          }
          // The extension crops with tabs.captureTab, so the image is the iframe.
          previewImg.src = ev.data.dataUrl
          const base64 = (ev.data.dataUrl.split(',')[1] || '').replace(/=+$/, '')
          captureInfo.textContent =
            'Captured image size: ' + ((base64.length * 3) / 4 / 1024).toFixed(1) + ' KB' +
            (ev.data.cropped ? ' (cropped by extension)' : ' (full viewport)')
        }
      })

      document.getElementById('getScore').addEventListener('click', getScore)
      document.getElementById('visibleCaptureBtn').addEventListener('click', visibleTabCapture)

      function getScore() {
        pending.score = genNonce()
        iframe.contentWindow.postMessage(
          { source: 'ScoreBridgeParent', type: 'GET_SCORE', nonce: pending.score },
          iframeOrigin()
        )
      }

      function visibleTabCapture() {
        const nonce = genNonce()
        pending.capture = nonce
        applyIframeFullscreenOverlay()
        // Fallback: restore after 3s if no response
        captureState.timeoutId = setTimeout(() => {
          if (pending.capture === nonce) {
            pending.capture = null
            captureInfo.textContent = 'No capture response (is the dev extension loaded?)'
          }
          restoreIframeFromFullscreen()
        }, 3000)
        setTimeout(() => {
          captureInfo.textContent = 'Waiting for capture...'
          // Arm the extension for this one capture, then ask the game frame.
          window.postMessage({ type: 'SCOREBRIDGE_ARM', nonce }, location.origin)
          iframe.contentWindow.postMessage(
            { source: 'ScoreBridgeParent', type: 'REQUEST_VISIBLE_TAB_FROM_PARENT', nonce },
            iframeOrigin()
          )
        }, 300) // let the overlay layout settle before the capture
      }
    </script>
  </body>
</html>
