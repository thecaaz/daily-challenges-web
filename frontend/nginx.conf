# Included inside the http {} block of nginxinc/nginx-unprivileged (runs as uid 101).

# Cache policy per response URI (after try_files/index rewrites, so SPA routes map to /index.html).
# An empty value means the header is not sent.
map $uri $cache_control {
    default        "";
    /index.html    "no-cache";
    /env.js        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    ~*\.xpi$       "no-cache";
}

# Only send "Connection: upgrade" when the client actually asked for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Real client IP when a TLS-terminating proxy sits in front of this
    # container on a private network: trust X-Forwarded-For only from private
    # / loopback addresses and take the right-most untrusted address, so a
    # client can't spoof its IP by sending its own X-Forwarded-For.
    # (ngx_http_realip_module is built into the official nginx images.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Screenshot uploads go through /api; the 1m default rejects valid 1-2 MB images.
    client_max_body_size 5m;

    # Declared once at server level so every location inherits them
    # (no location below uses add_header, which would drop these).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Runtime config written by docker-entrypoint.sh (writable location for the unprivileged user).
    location = /env.js {
        alias /tmp/env.js;
        default_type application/javascript;
    }

    # Serve XPI files explicitly to avoid the SPA fallback and ensure MIME type
    location ~* \.xpi$ {
        try_files $uri =404;
        default_type application/x-xpinstall;
    }

    # Hashed build assets: 404 if missing (never fall back to index.html), cached for a year.
    location /assets/ {
        try_files $uri =404;
    }

    # Static files directly, fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: proxy to the backend service (compose service name: backend).
    # No URI part on proxy_pass, so the /api prefix is preserved.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # $remote_addr is the resolved client IP (see realip above). Send it as
        # the single X-Forwarded-For value: the backend trusts exactly one hop
        # (ForwardLimit=1, this container).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
