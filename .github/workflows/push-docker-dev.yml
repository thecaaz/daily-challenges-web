name: Build and Push Dev Docker Images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push'
        required: true
        default: 'dev'

permissions:
  contents: read

jobs:
  # Resolve the branch once, so the tests and the images use the same commit
  # even if the branch moves while this workflow runs.
  resolve:
    name: Resolve branch to a commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - name: Resolve commit
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Building ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  test-backend:
    name: Test backend
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore daily-challenges-web.sln
      - name: Build
        run: dotnet build daily-challenges-web.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test daily-challenges-web.sln --configuration Release --no-build

  test-frontend:
    name: Test frontend
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test

  build-and-push:
    name: Build and push backend + frontend images (:dev)
    needs: [resolve, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            caaz/daily-challenge-web-backend:dev

      - name: Build and push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            caaz/daily-challenge-web-frontend:dev
