name: Release

on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install release dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Create release-info.json
        if: ${{ always() }}
        run: |
          # Ensure we have tags available
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 || echo "")
          # Fallback to npm package version
          if [ -z "$TAG" ] && [ -f package.json ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION=${TAG#v}
          RAW="${TAG}+${GITHUB_SHA}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT=${GITHUB_SHA}
          printf '%s\n' '{' \
            "  \"version\": \"${VERSION}\"," \
            "  \"rawVersion\": \"${RAW}\"," \
            "  \"commit\": \"${COMMIT}\"," \
            "  \"timestamp\": \"${TIMESTAMP}\"" \
            '}' > release-info.json

      - name: Upload release-info artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info.json

  docker:
    name: Build & push Docker images
    needs: release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Ensure branch head and tags
        run: |
          git fetch origin main --tags
          git checkout origin/main
          git reset --hard origin/main

      - name: Download release-info artifact
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: .

      - name: Place release-info.json into backend/
        run: |
          if [ -f release-info.json ]; then
            mv release-info.json backend/release-info.json
          fi

      - name: Get release version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            caaz/daily-challenge-web-backend:latest
            caaz/daily-challenge-web-backend:${{ steps.version.outputs.version }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            caaz/daily-challenge-web-frontend:latest
            caaz/daily-challenge-web-frontend:${{ steps.version.outputs.version }}
