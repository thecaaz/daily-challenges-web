name: Build and Push Dev Docker Images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push'
        required: true
        default: 'main'
      dockerhub_namespace:
        description: 'Optional Docker Hub namespace (username or org). If empty, uses repository owner'
        required: false
        default: ''

jobs:
  build-and-push:
    name: Build and push backend + frontend images (:dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up QEMU (optional)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Resolve Docker Hub namespace
        id: ns
        run: |
          if [ -n "${{ inputs.dockerhub_namespace }}" ]; then
            echo "namespace=${{ inputs.dockerhub_namespace }}" >> $GITHUB_OUTPUT
          else
            echo "namespace=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.ns.outputs.namespace }}/daily-challenges-backend:dev

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.ns.outputs.namespace }}/daily-challenges-frontend:dev