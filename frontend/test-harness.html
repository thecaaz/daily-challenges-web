<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ScoreBridge PoC Test Harness</title>
  <style>
    body { font-family: system-ui, Arial; padding: 20px; }
    iframe { width: 100%; height: 800px; border: 1px solid #ddd; }
    .preview { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>ScoreBridge PoC — Test Harness</h1>
  <p>Uses a local sample game in <code>frontend/sample-game.html</code> to demonstrate <code>postMessage</code> GET_SCORE flow.</p>

  <iframe id="gameFrame" src="https://timeguessr.com/roundonedaily"></iframe>

  <div style="margin-top:12px">
    <button id="getScore">Request Score</button>
  </div>

  <div class="results">
    <h3>Result</h3>
    <pre id="result">(no result yet)</pre>
  </div>

  <script>
    const iframe = document.getElementById('gameFrame');
    const result = document.getElementById('result');
    const previewImg = document.getElementById('previewImg');

    function genNonce() { return Math.random().toString(36).slice(2); }

    window.addEventListener('message', ev => {
      console.debug('TestHarness: message received', { data: ev.data, origin: ev.origin });
      if (!ev.data || typeof ev.data.type !== 'string') return;
      if (ev.data.type === 'SCORE_RESPONSE') {
        console.debug('TestHarness: SCORE_RESPONSE', ev.data);
        result.textContent = 'Score: ' + JSON.stringify(ev.data.score);
      }
    });

    document.getElementById('getScore').addEventListener('click', () => {
      const nonce = genNonce();
      console.debug('TestHarness: sending GET_SCORE', { nonce });
      iframe.contentWindow.postMessage({ source: 'ScoreBridgeParent', type: 'GET_SCORE', nonce }, '*');
    });

    // capture flow removed for PoC; focus on reliable score retrieval across iframes
  </script>
</body>
</html>
